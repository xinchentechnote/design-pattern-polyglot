name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [rust, go, cpp, java, python]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: matrix.lang == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dp-in-rust

      - name: Set up Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: dp-in-go/go.mod
          cache: false

      - name: Install C++ dependencies
        if: matrix.lang == 'cpp'
        run: sudo apt-get update -q && sudo apt-get install -y zlib1g-dev

      - name: Set up Java
        if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: matrix.lang == 'java'
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: ./build.sh test --lang ${{ matrix.lang }} --strict

  package:
    name: build & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dp-in-rust

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: dp-in-go/go.mod
          cache: false

      - name: Install C++ dependencies
        run: sudo apt-get update -q && sudo apt-get install -y zlib1g-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and package
        run: ./build.sh build package --strict

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
